<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel interno · CM Banquetería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260805-admin-nav-v44">
</head>
<body class="internal-cm-theme admin-theme">
  <div id="loginView" class="login-page">
    <form class="card login-card form-grid" id="loginForm">
      <img src="/assets/logo-cm.png" style="width:120px;margin:auto" alt="CM">
      <div><div class="kicker">Acceso interno</div><h2>CM Administración</h2><p class="muted">Panel privado para administrar la operación del restaurant.</p></div>
      <div class="form-line"><label>Usuario</label><input name="user" type="email" required></div>
      <div class="form-line"><label>Contraseña</label><input name="password" type="password" required></div>
      <button class="btn btn-primary" type="submit">Ingresar</button><a class="btn btn-secondary" href="/">Volver a la web</a>
    </form>
  </div>
  <div id="adminView" class="hidden">
    <header class="topbar"><div class="container nav"><a class="brand" href="/"><img class="brand-logo" src="/assets/logo-cm.png" alt="CM"><span>Panel CM<br><small>Administración interna</small></span></a><div class="internal-top-actions"><a class="btn btn-secondary" href="/pantalla.html" target="_blank">Pantalla</a><a class="btn btn-secondary" href="/" target="_blank">Web</a><button class="btn btn-primary" id="logoutBtn">Salir</button></div></div></header>
    <div class="admin-shell">
      <aside class="sidebar">
        <h3>Módulos</h3>
        <button class="side-btn side-btn-standalone active" data-view="dashboard" type="button">Panel diario</button>
        <div class="side-group" data-group="operacion-diaria">
          <button class="side-group-toggle" type="button" aria-expanded="false"><span class="material-symbols-rounded" aria-hidden="true">restaurant</span><span>Operación diaria</span></button>
          <div class="side-submenu">
            <button class="side-btn" data-view="operations">Reservas / Cocina</button>
            <button class="side-btn" data-view="menus">Menú del día</button>
          </div>
        </div>
        <div class="side-group" data-group="comercial">
          <button class="side-group-toggle" type="button" aria-expanded="false"><span class="material-symbols-rounded" aria-hidden="true">request_quote</span><span>Comercial</span></button>
          <div class="side-submenu">
            <button class="side-btn" data-view="quotes">Cotizaciones</button>
          </div>
        </div>
        <div class="side-group" data-group="compras-stock">
          <button class="side-group-toggle" type="button" aria-expanded="false"><span class="material-symbols-rounded" aria-hidden="true">inventory_2</span><span>Compras y stock</span></button>
          <div class="side-submenu">
            <button class="side-btn" data-view="dailyCosts">Costos diarios</button>
            <button class="side-btn" data-view="expenses">Gastos</button>
            <button class="side-btn" data-view="suppliers">Proveedores</button>
          </div>
        </div>
        <div class="side-group" data-group="gestion-interna">
          <button class="side-group-toggle" type="button" aria-expanded="false"><span class="material-symbols-rounded" aria-hidden="true">assignment</span><span>Gestión interna</span></button>
          <div class="side-submenu">
            <button class="side-btn" data-view="staff">Personal</button>
            <button class="side-btn" data-view="documents">Carpeta documental</button>
          </div>
        </div>
      </aside>
      <main class="admin-main"><div class="toolbar"><div><div class="kicker" id="viewKicker">Panel</div><h2 id="viewTitle">Resumen operativo</h2></div><div id="viewActions"></div></div><section id="content"></section></main>
    </div>
  </div>
  <dialog class="modal" id="modal"><form class="modal-content form-grid" id="modalForm"></form></dialog>
  <script src="/menu-graphic.js?v=20260805-admin-nav-v44"></script>
  <script src="/admin.js?v=20260805-admin-nav-v44"></script>
  <script src="/purchases.js?v=20260721-final-v24"></script>
  <script src="/kitchen-minutas.js?v=20260721-final-v24"></script>
  <script src="/costs.js?v=20260805-admin-nav-v44"></script>
</body>
</html>
