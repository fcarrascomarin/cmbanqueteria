
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sigue tu pedido · CM Banquetería</title>
  <link rel="stylesheet" href="/styles.css?v=20260708-personal-v9" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/">
        <span class="brand-mark">CM</span>
        <span>CM Banquetería<br><small>& Restaurant</small></span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-secondary" href="/">Volver al inicio</a>
        <a class="btn btn-primary" href="/#delivery">Pedir</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <div class="kicker">Seguimiento</div>
          <h2>Sigue tu pedido</h2>
        </div>
        <p>
          Puedes revisar el avance mediante el enlace único entregado después del pago o ingresar
          tu teléfono y número de pedido.
        </p>
      </div>

      <section class="card">
        <form class="tracking-search" id="trackForm">
          <div class="form-line">
            <label>Número de pedido</label>
            <input class="input" name="orderNumber" placeholder="Ej: CM-0001" required />
          </div>
          <div class="form-line">
            <label>Teléfono</label>
            <input class="input" name="phone" placeholder="+56 9..." />
          </div>
          <button class="btn btn-primary" type="submit">Consultar</button>
        </form>
        <p class="form-note">
          Si entraste desde el enlace único, la página cargará automáticamente el pedido.
        </p>
      </section>

      <section id="orderResult" class="section hidden" style="padding-bottom:0;"></section>
    </div>
  </main>

  <script src="/seguimiento.js"></script>
</body>
</html>
