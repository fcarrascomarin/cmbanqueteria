<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pantalla interna · CM</title>
  <link rel="stylesheet" href="/styles.css?v=20260709-videos-layout-v14">
</head>
<body class="screen-body operations-screen">
  <main class="kds-shell">
    <header class="kds-header">
      <div>
        <img src="/assets/logo-cm.png" alt="CM">
        <div><span>CM Banquetería & Restaurant</span><strong>Pantalla interna</strong></div>
      </div>
      <div class="kds-clock" id="clockBox">--:--</div>
    </header>
    <section class="kds-summary" id="summaryBox"></section>
    <section class="kds-grid">
      <div class="kds-column"><h2>Confirmado / preparación</h2><div id="prepBox" class="kds-list"></div></div>
      <div class="kds-column"><h2>Listo / entrega</h2><div id="readyBox" class="kds-list"></div></div>
      <aside class="kds-side">
        <div class="kds-card"><h2>Mensajes administración</h2><div id="messageBox" class="kds-list compact"></div></div>
        <div class="kds-card"><h2>Menú y minutas</h2><div id="menuBox"></div></div>
      </aside>
    </section>
  </main>
  <script src="/pantalla.js"></script>
</body>
</html>
